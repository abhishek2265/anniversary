<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06.12.23 | Forever</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&family=Caveat:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #9B1B1B; --cream: #FFF9F5; }
        body, html { margin: 0; padding: 0; background-color: var(--cream); font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; }

        .page { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #lock-screen { background: var(--primary-red); z-index: 1000; color: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 70px); gap: 15px; margin-top: 20px; }
        .key { width: 70px; height: 70px; border-radius: 50%; border: 1px solid white; background: transparent; color: white; font-size: 1.2rem; cursor: pointer; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 300px; }
        .menu-item { background: white; padding: 15px; border-radius: 12px; border: 1.5px solid var(--primary-red); cursor: pointer; font-family: 'Dancing Script'; font-size: 1.2rem; }

        .scroll-container { width: 100%; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .video-box { width: 260px; height: 400px; background: #000; border-radius: 10px; border: 3px solid white; overflow: hidden; flex-shrink: 0; }
        video { width: 100%; height: 100%; }

        .btn-back { margin-top: 20px; color: #888; background: none; border: none; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- 1. LOCK SCREEN (0612) -->
    <div id="lock-screen" class="page active">
        <h2 style="font-family: 'Dancing Script';">Our Space</h2>
        <p>Anniversary Date (DDMM)</p>
        <div id="pass-display" style="font-size: 2rem; letter-spacing: 5px;">____</div>
        <div class="keypad">
            <button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
            <button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
            <button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
            <span></span><button class="key" onclick="press('0')">0</button>
        </div>
    </div>

    <!-- 2. HOME -->
    <div id="page-home" class="page">
        <h1 style="font-family: 'Dancing Script'; color: var(--primary-red);">Hi Meenal!</h1>
        <div class="menu-grid">
            <div class="menu-item" onclick="showPage('page-stats')">📊 Stats</div>
            <div class="menu-item" onclick="showPage('page-timeline')">📅 Timeline</div>
            <div class="menu-item" onclick="showPage('page-memories')">📸 Memories</div>
            <div class="menu-item" onclick="showPage('page-reels')">🎬 Reels</div>
            <div class="menu-item" onclick="showPage('page-letter')" style="grid-column: span 2;">✉️ Note</div>
        </div>
    </div>

    <!-- 3. STATS (882 Days) -->
    <div id="page-stats" class="page">
        <h2 style="font-family: 'Dancing Script';">882 Days Together</h2>
        <p>Since 06 Dec 2023</p>
        <button class="btn-back" onclick="showPage('page-home')">Go Back</button>
    </div>

    <!-- 4. REELS (SCROLLABLE) -->
    <div id="page-reels" class="page">
        <h2 style="font-family: 'Dancing Script';">Our Videos</h2>
        <div class="scroll-container">
            <div class="video-box">
                <video controls playsinline preload="none">
                    <source src="https://www.dropbox.com/scl/fi/3vufbk9ikkc1t6wreyeqm/reel.mp4.mp4?rlkey=eocodry8xbve7pfb4797fmem4&st=6zwtd2n0&dl=1" type="video/mp4">
                </video>
            </div>
            <div class="video-box">
                <video controls playsinline preload="none">
                    <source src="https://www.dropbox.com/scl/fi/xq2hr273d9jwbo742wdk5/WhatsApp-Video-2026-05-06-at-5.38.21-PM.mp4?rlkey=2xfnor41jbam5at26g8zsfwbn&st=bz6nxy7v&dl=1" type="video/mp4">
                </video>
            </div>
        </div>
        <button class="btn-back" onclick="showPage('page-home')">Go Back</button>
    </div>

    <div id="page-timeline" class="page">
        <h2 style="font-family: 'Dancing Script';">The Journey</h2>
        <p>06 Dec 2023 - Today</p>
        <button class="btn-back" onclick="showPage('page-home')">Go Back</button>
    </div>

    <div id="page-memories" class="page">
        <h2 style="font-family: 'Dancing Script';">Moments</h2>
        <div class="scroll-container">
            <img src="https://i.postimg.cc/FFqMBPGM/first-date-jpeg.jpg" width="150">
            <img src="https://i.postimg.cc/xdpQT9yQ/image-4080x3780.jpg" width="150">
        </div>
        <button class="btn-back" onclick="showPage('page-home')">Go Back</button>
    </div>

    <div id="page-letter" class="page">
        <div style="background: white; padding: 20px; border-radius: 10px; border-left: 5px solid var(--primary-red);">
            <p style="font-family: 'Caveat'; font-size: 1.2rem;">Meenal, Happy Anniversary! I love you. ❤️</p>
        </div>
        <button class="btn-back" onclick="showPage('page-home')">Go Back</button>
    </div>

    <script>
        let input = "";
        const code = "0612";
        function press(num) {
            if (input.length < 4) {
                input += num;
                document.getElementById('pass-display').innerText = input + "_".repeat(4 - input.length);
            }
            if (input.length === 4) {
                if (input === code) { showPage('page-home'); }
                else { alert("Try again!"); input = ""; document.getElementById('pass-display').innerText = "____"; }
            }
        }
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'flex';
        }
    </script>
</body>
</html>
